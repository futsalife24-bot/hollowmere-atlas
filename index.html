function updateMotion(){const on=state.motion&&!mqReduce.matches;$("#motion-toggle").setAttribute("aria-pressed",String(on));$("#motion-toggle").title=on?"動きを止める":"動きを再開";if(!lumaLoaded)return;lumaImage.setAttribute("href",on?"assets/luma-swim-v4-atlas.webp":"assets/luma-still-v4.png");try{on?lumaMotion.beginElement():lumaMotion.endElement()}catch{}}
function callLuma(){ensureLuma();const list=displayPlaces(),p=list[Math.floor(Math.random()*list.length)];state.region=p.r;state.place=p.n;hashState();render();announcer.textContent=`LumaがEpisode ${p.n}へ案内します`}
function search(q){q=q.trim().toLowerCase();const box=$("#search-results");if(!q){box.dataset.open="false";return}const terms=q.split(/\s+/),results=PLACES.filter(p=>{const r=REALMS.surface.regions[p.r],hay=`${p.n} episode ${p.name} ${p.r} ${r.label} ${r.jp}`.toLowerCase();return terms.every(t=>hay.includes(t))}).slice(0,8);box.replaceChildren();if(!results.length){box.innerHTML='<div class="search-empty">まだ地図にない言葉みたいや。別の題名や番号を試してな。</div>'}for(const p of results){const b=document.createElement("button");b.className="search-result";b.setAttribute("role","option");b.innerHTML=`<b>EPISODE ${p.n} · ${REALMS.surface.regions[p.r].jp}</b><span>${p.name}</span>`;b.onclick=()=>{$("#search").value="";box.dataset.open="false";goEpisode(p.n)};box.append(b)}box.dataset.open="true"}
document.querySelectorAll(".realm-tab").forEach(b=>b.onclick=()=>selectLayer(b.dataset.layer));$("#overview").onclick=()=>{state.region=null;state.place=null;hashState();render()};$("#latest").onclick=()=>goEpisode(Math.max(...PLACES.map(p=>p.n)));$("#call-luma").onclick=$("#luma-map").onclick=callLuma;$("#motion-toggle").onclick=()=>{state.motion=!state.motion;updateMotion()};$("#search").addEventListener("input",e=>search(e.target.value));$("#search").addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";search("")}});$("#detail-close").onclick=()=>closeDetail();$("#prev-place").onclick=()=>goEpisode(state.place<=1?PLACES.length:state.place-1);$("#next-place").onclick=()=>goEpisode(state.place>=PLACES.length?1:state.place+1);$("#youtube").addEventListener("click",()=>{visited.add(state.place);localStorage.setItem("hollowmereVisited",JSON.stringify([...visited]));renderMarkersOnly()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("#search-results").dataset.open==="true"){search("");return}if(state.place){closeDetail();return}if(state.region){state.region=null;hashState();render()}});addEventListener("popstate",()=>{loadHash();switchMap();render()});addEventListener("resize",()=>{updateAspect();state.region?renderPlaces():renderRegions();updateLumaSize()});mqReduce.addEventListener?.("change",updateMotion);
loadHash();switchMap();render();hashState(false);setTimeout(ensureLuma,1200);
</script>
</body>
</html>
